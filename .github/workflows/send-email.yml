name: Daily Email Automation

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间 8 点）发送
  workflow_dispatch:      # 允许手动点击按钮触发测试

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send mail via QQ
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_SMTP_USER }}
          password: ${{ secrets.QQ_SMTP_PASS }}
          subject: "来自你的漏风小棉袄" #这里修改标题
          to: ${{ secrets.MY_RECIPIENT }}  # ⚠️ 请把这里改成要收信的邮箱地址！
          from: QQ邮箱通知机器人
          body: "亲爱的老爸，早上好~不要忘记读书哦。" #这里修改内容
